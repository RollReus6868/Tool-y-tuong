on:
  push:
    tags: ['v*']
  workflow_dispatch:

name: Đóng gói Tool Ý Tưởng

permissions:
  contents: write

jobs:

  # Tầng 1 chạy trên chính hệ điều hành đích, không chỉ trên Linux: đường dẫn,
  # phân biệt hoa thường và múi giờ là ba chỗ Windows/macOS hay khác Linux.
  kiem-thu:
    strategy:
      fail-fast: false
      matrix:
        may: [windows-latest, macos-latest]
    runs-on: ${{ matrix.may }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/run.js

  windows:
    needs: kiem-thu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LUÔN ghi rõ --publish. Bỏ trống thì electron-builder tự nhận ra đang
      # chạy trong CI và ngầm bật chế độ publish ("Implicit publishing triggered
      # by CI detection"), rồi chết vì không thấy GH_TOKEN — build đúng mà vẫn
      # đỏ, log lại toàn stack trace của PublishManager nên rất dễ đổ oan cho
      # khâu đóng gói.
      - name: Dựng và đẩy .exe lên Releases — tự thử lại nếu mạng chập chờn
        shell: bash
        run: |
          for lan in 1 2 3; do
            echo "--- Lần thử $lan ---"
            if npx electron-builder --win --publish always; then
              echo "Xong ở lần thử $lan."
              exit 0
            fi
            echo "Lần $lan thất bại. Chờ 20 giây rồi thử lại..."
            sleep 20
          done
          echo "Thất bại cả 3 lần. Đọc log của lần cuối ở trên để biết lý do thật."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    needs: kiem-thu
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dựng và đẩy .dmg + .zip lên Releases — tự thử lại nếu mạng chập chờn
        shell: bash
        run: |
          for lan in 1 2 3; do
            echo "--- Lần thử $lan ---"
            if npx electron-builder --mac --publish always; then
              echo "Xong ở lần thử $lan."
              exit 0
            fi
            echo "Lần $lan thất bại. Chờ 20 giây rồi thử lại..."
            sleep 20
          done
          echo "Thất bại cả 3 lần. Đọc log của lần cuối ở trên để biết lý do thật."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Không có chứng chỉ Apple thì phải tắt hẳn khâu tự dò chữ ký, nếu
          # không electron-builder dừng giữa chừng với "no identity found".
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
